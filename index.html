<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    user-select: none;
    background-color: transparent;
  }

  #screen {
    position: absolute;
    left: 0; top: 0;
    width: 100vw;
    height: 100vh;
    object-fit: fill;
    pointer-events: none;
  }

  #overlay {
    position: absolute;
    left: 0; top: 0;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }

  #selection {
    position: absolute;
    border: 1px solid red;
    background: transparent;
    display: none;
    cursor: move;
    box-sizing: border-box;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <img src="" alt="" id="screen">
  <div id="overlay"></div>
  <div id="selection"></div>
</body>
<script src="./renderer.js"></script>
</html>
