<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.15); /* 半透明遮罩，可选 */
    user-select: none;
  }
  #selection {
    position: absolute;
    border: 2px solid #ff0000;
    display: none;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.25); /* 选区外压暗，可选 */
  }
</style>
</head>
<body>
<div id="selection"></div>

<script>
  const sel = document.getElementById('selection')
  let startX = 0, startY = 0
  let dragging = false

  // 逻辑坐标 → 物理像素
  const toPhysical = (logicalVal) => Math.round(logicalVal * window.devicePixelRatio)

  document.body.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return
    dragging = true
    startX = e.screenX
    startY = e.screenY
    sel.style.display = 'block'
    sel.style.left = startX + 'px'
    sel.style.top = startY + 'px'
    sel.style.width = '0px'
    sel.style.height = '0px'
  })

  document.body.addEventListener('mousemove', (e) => {
    if (!dragging) return
    const curX = e.screenX
    const curY = e.screenY
    const left = Math.min(startX, curX)
    const top = Math.min(startY, curY)
    const width = Math.abs(curX - startX)
    const height = Math.abs(curY - startY)

    sel.style.left = left + 'px'
    sel.style.top = top + 'px'
    sel.style.width = width + 'px'
    sel.style.height = height + 'px'
  })

  document.body.addEventListener('mouseup', (e) => {
    if (!dragging) return
    dragging = false

    const endX = e.screenX
    const endY = e.screenY
    const logicalLeft = Math.min(startX, endX)
    const logicalTop = Math.min(startY, endY)
    const logicalWidth = Math.abs(endX - startX)
    const logicalHeight = Math.abs(endY - startY)

    // 忽略过小选区
    if (logicalWidth < 5 || logicalHeight < 5) {
      sel.style.display = 'none'
      return
    }

    // 转换成物理像素，交给主进程截图
    const physicalRect = {
      x: toPhysical(logicalLeft),
      y: toPhysical(logicalTop),
      width: toPhysical(logicalWidth),
      height: toPhysical(logicalHeight)
    }

    console.log('物理像素选区:', physicalRect)
    // 例如通过 IPC 发给主进程：
    // window.electronAPI.captureArea(physicalRect)
  })

  // 按 Esc 取消
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      dragging = false
      sel.style.display = 'none'
      // 通知主进程关闭覆盖窗口
    }
  })
</script>
</body>
</html>
